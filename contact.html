<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somesh sachool - Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1f6feb;
    --font: 'Poppins', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); color: #1a1a1a; line-height: 1.6; }
  a { color: inherit; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  nav.site-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    position: sticky; top: 0; z-index: 100;
  }
  nav.site-nav .brand { font-weight: 700; font-size: 1.2rem; color: var(--primary); }
  nav.site-nav ul { list-style: none; display: flex; gap: 24px; }
  nav.site-nav a { text-decoration: none; font-weight: 600; color: #333; }
  nav.site-nav a:hover { color: var(--primary); }

  footer.site-footer {
    background: #12141a; color: #ccc; text-align: center; padding: 30px 20px; margin-top: 60px;
    font-size: 0.9rem;
  }

  /* ---- Block styles ---- */
  .block { padding: 60px 0; }

  .hero-block {
    background-size: cover; background-position: center; color: #fff; text-align: center;
    padding: 100px 20px; position: relative;
  }
  .hero-block::before {
    content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.45);
  }
  .hero-block .hero-content { position: relative; z-index: 2; max-width: 700px; margin: 0 auto; }
  .hero-block h1 { font-size: 2.6rem; margin-bottom: 16px; }
  .hero-block p { font-size: 1.1rem; margin-bottom: 24px; opacity: 0.95; }
  .btn {
    display: inline-block; background: var(--primary); color: #fff; padding: 12px 28px;
    border-radius: 6px; text-decoration: none; font-weight: 600; border: none; cursor: pointer;
  }

  .text-section h2 { font-size: 1.8rem; margin-bottom: 16px; color: var(--primary); }

  .gallery-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 20px;
  }
  .gallery-grid figure { margin: 0; border-radius: 8px; overflow: hidden; background: #f2f2f2; }
  .gallery-grid img { width: 100%; height: 180px; object-fit: cover; display: block; }
  .gallery-grid figcaption { padding: 8px; font-size: 0.85rem; text-align: center; }

  .form-block h2 { color: var(--primary); margin-bottom: 20px; }
  .form-block form { display: flex; flex-direction: column; gap: 14px; max-width: 500px; }
  .form-block label { font-weight: 600; font-size: 0.9rem; }
  .form-block input, .form-block textarea, .form-block select {
    padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: var(--font); width: 100%;
  }

  .faculty-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px;
  }
  .faculty-card { text-align: center; }
  .faculty-card img {
    width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-bottom: 10px;
  }
  .faculty-card .designation { color: #666; font-size: 0.9rem; }

  .notice-list { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .notice-item { border-left: 4px solid var(--primary); padding: 10px 16px; background: #f8f9fb; }
  .notice-item .date { font-size: 0.8rem; color: #888; }

  .contact-block .details { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .contact-block iframe { width: 100%; height: 300px; border: 0; margin-top: 20px; border-radius: 8px; }

  @media (max-width: 640px) {
    nav.site-nav ul { gap: 12px; font-size: 0.85rem; }
    .hero-block h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="brand">Somesh sachool</div>

</nav>

</html>
